version: '3.8'

# Docker Compose setup for SLSA Demo App development
# This makes it easy to run the app locally with proper networking

services:
  # Main Flask application
  slsa-demo-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_DATE: "${BUILD_DATE:-}"
        VCS_REF: "${VCS_REF:-}"
        VERSION: "${VERSION:-1.0.0}"
    image: slsa-demo-app:latest
    container_name: slsa-demo-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=true
      - ENVIRONMENT=docker-development
      - LOG_LEVEL=INFO
    volumes:
      # Mount source code for development (comment out for production)
      - ./src:/app/src:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - slsa-network

  # PostgreSQL database (for later stages)
  postgres:
    image: postgres:14-alpine
    container_name: slsa-postgres
    environment:
      POSTGRES_DB: slsa_demo
      POSTGRES_USER: slsa_user
      POSTGRES_PASSWORD: slsa_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - slsa-network
    profiles:
      - database  # Only start with: docker-compose --profile database up

  # Adminer for database management (optional)
  adminer:
    image: adminer:latest
    container_name: slsa-adminer
    ports:
      - "8080:8080"
    networks:
      - slsa-network
    profiles:
      - database
    depends_on:
      - postgres

networks:
  slsa-network:
    driver: bridge
    name: slsa-network

volumes:
  postgres_data:
    name: slsa-postgres-data