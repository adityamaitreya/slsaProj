name: Build, Sign, and Attest

# Stages covered by this workflow:
#   A3 - CI/CD pipeline (build + push)
#   A4 - SBOM generation (Syft)
#   A5 - SLSA provenance (GitHub's slsa-framework generator)
#   A6 - Cosign signing (keyless via GitHub OIDC)

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 1 — Build and push the Docker image, generate SBOM, sign image
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-sign-attest:
    name: Build, Sign & Attest
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write   # needed by Cosign (OIDC) and SLSA generator

    outputs:
      # Pass the image digest to the provenance job
      image-digest: ${{ steps.build-and-push.outputs.digest }}
      image-ref:    ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Docker Buildx ─────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── 3. Install Cosign ────────────────────────────────────────────────
      #
      # Cosign is Sigstore's tool for keyless container signing.
      # "Keyless" means we never manage a private key ourselves.
      # Instead, GitHub's OIDC token proves identity, and Sigstore
      # records the signature in a public transparency log (Rekor).
      #
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.2.3'

      # ── 4. Log in to GHCR ────────────────────────────────────────────────
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Extract image metadata (tags + OCI labels) ────────────────────
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=SLSA Demo Application
            org.opencontainers.image.description=Flask app for supply chain provenance verification research
            org.opencontainers.image.vendor=SLSA Research Project

      # ── 6. Build and push ────────────────────────────────────────────────
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          file: ./app/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false   # we generate our own SLSA provenance below
          sbom: false         # we generate our own SBOM below

      # ── 7. Save digest ───────────────────────────────────────────────────
      - name: Save image digest
        id: digest
        run: |
          echo "digest=${{ steps.build-and-push.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "${{ steps.build-and-push.outputs.digest }}" > image-digest.txt
          echo "📦 Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "🔑 Digest: ${{ steps.build-and-push.outputs.digest }}"

      # ── 8. Sign the image with Cosign (Stage A6) ─────────────────────────
      #
      # cosign sign uses the GitHub OIDC token to prove "this signature
      # was created inside this GitHub Actions run for this repo".
      # The signature is pushed as an OCI artifact alongside the image
      # AND recorded in Sigstore's Rekor transparency log (public proof).
      #
      # Anyone can verify later with:
      #   cosign verify ghcr.io/USER/REPO@sha256:... \
      #     --certificate-identity-regexp="https://github.com/USER/REPO" \
      #     --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
      #
      - name: Sign image with Cosign
        if: github.event_name != 'pull_request'
        env:
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
          TAGS:   ${{ steps.meta.outputs.tags }}
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"
          echo "🔏 Signing image: ${IMAGE_REF}"
          cosign sign --yes "${IMAGE_REF}"
          echo "✅ Image signed and recorded in Rekor transparency log"

      # ── 9. Generate SBOM with Syft (Stage A4) ───────────────────────────
      - name: Install Syft
        if: github.event_name != 'pull_request'
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh \
            | sh -s -- -b /usr/local/bin
          syft version

      - name: Generate SBOM
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"
          syft "${IMAGE_REF}" \
            -o spdx-json=sbom.spdx.json \
            -o cyclonedx-json=sbom.cyclonedx.json \
            -o json=sbom.syft.json
          PKG_COUNT=$(jq '.artifacts | length' sbom.syft.json)
          echo "📊 Packages in SBOM: ${PKG_COUNT}"

      # ── 10. Attest SBOM with Cosign (Stage A6 extension) ─────────────────
      #
      # cosign attest pushes the SBOM as a signed attestation attached
      # to the image in the registry.  This binds the SBOM cryptographically
      # to the specific image digest — nobody can swap the SBOM undetected.
      #
      - name: Attest SBOM with Cosign
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_REF="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build-and-push.outputs.digest }}"
          cosign attest --yes \
            --predicate sbom.cyclonedx.json \
            --type cyclonedx \
            "${IMAGE_REF}"
          echo "✅ SBOM attestation pushed to registry"

      # ── 11. Upload artifacts ─────────────────────────────────────────────
      - name: Upload SBOM artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sbom-files
          path: |
            sbom.spdx.json
            sbom.cyclonedx.json
            sbom.syft.json
          retention-days: 90

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest
          path: image-digest.txt
          retention-days: 90

      # ── 12. Build summary ─────────────────────────────────────────────────
      - name: Build summary
        if: github.event_name != 'pull_request'
        run: |
          DIGEST="${{ steps.build-and-push.outputs.digest }}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "## ✅ Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Image | \`${IMAGE}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Digest | \`${DIGEST}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Builder | GitHub Actions |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Supply chain artefacts" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Docker image pushed to GHCR" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Image signed with Cosign (keyless, OIDC)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM generated (SPDX + CycloneDX + Syft)" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SBOM attested with Cosign" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ SLSA provenance generating (next job)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Verify the signature" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "cosign verify ${IMAGE}@${DIGEST} \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-identity-regexp='https://github.com/${{ github.repository }}' \\" >> $GITHUB_STEP_SUMMARY
          echo "  --certificate-oidc-issuer='https://token.actions.githubusercontent.com'" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

# ─────────────────────────────────────────────────────────────────────────────
# JOB 2 — Generate SLSA provenance (Stage A5)
#
# This is a SEPARATE job because the SLSA generator needs to be the last
# thing that runs and needs the image digest as an input.
# The slsa-framework/slsa-github-generator action creates a signed
# provenance document in SLSA v1.0 format and attaches it to the image.
# ─────────────────────────────────────────────────────────────────────────────
  slsa-provenance:
    name: Generate SLSA Provenance
    needs: build-sign-attest
    if: github.event_name != 'pull_request'

    permissions:
      actions: read      # to read the workflow run
      id-token: write    # to sign the provenance
      packages: write    # to push attestation to GHCR

    # Must use a pinned version of the official SLSA generator
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.0.0
    with:
      image: ghcr.io/${{ github.repository }}
      digest: ${{ needs.build-sign-attest.outputs.image-digest }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

# ─────────────────────────────────────────────────────────────────────────────
# JOB 3 — Security scan (unchanged from before)
# ─────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build-sign-attest
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Security summary
        run: |
          echo "## 🔒 Security Scan Complete" >> $GITHUB_STEP_SUMMARY
          echo "Vulnerability scan results uploaded to Security tab" >> $GITHUB_STEP_SUMMARY
